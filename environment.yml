name: ecotype_ou_levy_branching

channels:
  - conda-forge
  - defaults

dependencies:
  # ------------------------------------------------------------------
  # Python
  # ------------------------------------------------------------------
  - python=3.12

  # ------------------------------------------------------------------
  # Core scientific computing
  # ------------------------------------------------------------------
  - numpy>=2.0
  - scipy>=1.14
  - pandas>=2.2
  - xarray
  - bottleneck

  # ------------------------------------------------------------------
  # Single-cell analysis
  # ------------------------------------------------------------------
  - anndata>=0.11
  - scanpy>=1.11
  - h5py
  - pytables
  - loompy

  # ------------------------------------------------------------------
  # Machine learning
  # ------------------------------------------------------------------
  - scikit-learn>=1.6
  - joblib

  # ------------------------------------------------------------------
  # Bayesian inference
  # ------------------------------------------------------------------
  - pymc>=5.24
  - arviz>=0.22

  # ------------------------------------------------------------------
  # Statistics
  # ------------------------------------------------------------------
  - statsmodels
  - pingouin

  # ------------------------------------------------------------------
  # Visualization
  # ------------------------------------------------------------------
  - matplotlib>=3.10
  - matplotlib-base
  - networkx

  # ------------------------------------------------------------------
  # File formats
  # ------------------------------------------------------------------
  - openpyxl
  - xlrd
  - pyyaml

  # ------------------------------------------------------------------
  # Jupyter
  # ------------------------------------------------------------------
  - notebook
  - jupyterlab
  - ipykernel

  # ------------------------------------------------------------------
  # Utilities
  # ------------------------------------------------------------------
  - tqdm
  - tabulate

  # ------------------------------------------------------------------
  # pip packages
  # ------------------------------------------------------------------
  - pip

  - pip:
      - python-igraph
      - leidenalg
      - umap-learn
